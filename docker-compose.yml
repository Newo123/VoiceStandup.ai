services:
  postgres:
    image: postgres:18-alpine
    container_name: voice-standup-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - voice-standup-network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:8-alpine
    container_name: voice-standup-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - --notify-keyspace-events
      - Ex

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    networks:
      - voice-standup-network

    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrator:
    build:
      context: ./migrations
      dockerfile: Dockerfile
      args:
        GOOSE_VERSION: v3.27.3
    image: voice-standup-goose-migrator:local
    container_name: voice-standup-migrator

    profiles:
      - tools

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations

    volumes:
      - ./migrations:/migrations:ro

    networks:
      - voice-standup-network

    command:
      - up

    restart: "no"

volumes:
  postgres_data:
  redis_data:

networks:
  voice-standup-network:
    driver: bridge
